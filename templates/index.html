<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <h1 class="main_heading">AI Personal Assistant</h1>

    <div class="container">
        <h2>AI Chatbot</h2>
        <div id="chat-box"></div>
        <form id="askForm">
            <input type="text" id="questionInput" name="question" placeholder="Type a message..." required>
            <button type="submit">Send</button>
            <button type="button" id="clearChatBtn" class="clear-btn">Clear Chat</button>
        </form>
        <p id="ans-loading" style="display:none;">Thinking...</p>

        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea type="text" name="email" placeholder="Paste your email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" style="display: none;">Processing...</p>
        <p id="summary"></p>

        <hr>

        <hr>

        <h2>Extract PDF / Excel / Financial Statements</h2>
        <form id="extractForm">
            <input type="file" name="file" accept=".pdf,.xlsx,.xls,.csv" required>
            <input type="text" name="query" placeholder="Optional: Ask a question about this file (e.g., Total revenue?)">
            <button type="submit">Extract & Analyze</button>
        </form>
        <p id="extract-loading" style="display: none;">Extracting and analyzing...</p>
        <div id="extract-analysis" class="output-box" style="display: none;"></div>
        <details id="raw-data-details" style="display: none; margin-top: 10px;">
            <summary style="cursor: pointer; color: #4a90e2; font-weight: bold;">View Raw Extracted Text & Tables</summary>
            <pre id="extracted-raw"></pre>
        </details>
    </div>

    <footer class="footer-card">
        <p class="footer-text">
            Created with <span class="heart-icon">❤️</span> by 
            <span class="author-name">Vinit Sarang</span>
            <span class="nitians-tag"><span class="grad-icon">🎓</span> NITIAN</span>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

    
</body>
</html>
